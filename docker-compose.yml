services:

  web:
    build: ./app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: ${DB_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure
    networks:
      - app-network
    labels:
      com.devops.day: "34"
      com.devops.service: "web"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-network
    labels:
      com.devops.day: "34"
      com.devops.service: "database"

  redis:
    image: redis:7-alpine
    networks:
      - app-network
    labels:
      com.devops.day: "34"
      com.devops.service: "cache"

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data: